name: Materialize Solvyn World

on:
  push:
    branches: [main]
    paths:
      - "solvyn-rpg/scripts/world.zlib.b64"
      - ".github/workflows/materialize-solvyn-world.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Materialize authored world source
        run: |
          python - <<'PY'
          import base64
          import pathlib
          import zlib

          encoded = pathlib.Path("solvyn-rpg/scripts/world.zlib.b64").read_text().strip()
          source = zlib.decompress(base64.b64decode(encoded))
          pathlib.Path("solvyn-rpg/src/world.js").write_bytes(source)
          PY
          node --check solvyn-rpg/src/world.js

      - name: Commit materialized world
        run: |
          if git diff --quiet -- solvyn-rpg/src/world.js; then
            echo "world.js already materialized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solvyn-rpg/src/world.js
          git commit -m "Materialize Solvyn experience world"
          git push
