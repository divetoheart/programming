<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>SCRAPHEAP — Early Access</title><style>html,body{margin:0;overflow:hidden;background:#090b0d;color:#eee;font-family:system-ui,sans-serif}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none}#top{display:flex;justify-content:space-between;padding:14px;font-weight:800;text-shadow:0 2px 4px #000}.panel{background:#101419dd;border:1px solid #3b4249;border-radius:10px;padding:9px 12px}.bar{width:190px;height:10px;background:#2b3035;border-radius:9px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:#d34545}.help{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:#101419dd;border:1px solid #3b4249;border-radius:9px;padding:8px 12px;font-size:12px}.feed{position:absolute;right:14px;top:80px;text-align:right;font-size:12px}.feed div{margin:4px}.cross{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px}.cross:before,.cross:after{content:'';position:absolute;background:#fff}.cross:before{width:10px;height:2px;top:4px}.cross:after{height:10px;width:2px;left:4px}#bench{pointer-events:auto;display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,90vw);background:#11161bf2;border:1px solid #555;border-radius:14px;padding:18px}#bench h2{margin:0 0 5px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.craft{background:#242b31;color:#eee;border:1px solid #555;border-radius:8px;padding:12px;text-align:left;cursor:pointer}.craft:hover{background:#343d45}.muted{color:#9ba5ad;font-size:12px}#msg{position:absolute;left:50%;top:16%;transform:translateX(-50%);font-weight:900;font-size:20px;text-shadow:0 2px 5px #000}.mobile{display:none}@media(max-width:800px),(pointer:coarse){.help{display:none}.mobile{display:grid;pointer-events:auto;position:absolute;bottom:18px;left:15px;right:15px;grid-template-columns:64px 64px 1fr 70px;gap:8px}.mobile button{height:58px;border:1px solid #666;border-radius:12px;background:#171c21cc;color:white;font-weight:800;font-size:18px}.bar{width:120px}}</style></head><body><canvas id="game"></canvas><div id="hud"><div id="top"><div class="panel">SCRAPHEAP <span class="muted">EA 0.1</span><div class="bar"><i id="hp"></i></div></div><div class="panel">KILLS <span id="kills">0</span> &nbsp; SCRAP ⚙ <span id="scrap">0</span><br><span class="muted" id="gear">FISTS · inventory empty</span></div></div><div class="feed" id="feed"></div><div class="cross"></div><div id="msg"></div><div class="help">WASD move · mouse look · click punch/fire · E scavenge · B weapon bench · SHIFT sprint</div><div class="mobile"><button id="ml">◀</button><button id="mr">▶</button><span></span><button id="ma">HIT</button></div><div id="bench"><h2>JUNK BENCH</h2><div class="muted" style="margin-bottom:12px">Kills buy hardware. Scavenged remains count as free components. Press B to close.</div><div class="grid" id="crafts"></div></div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const canvas=document.querySelector('#game'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.shadowMap.enabled=true;const scene=new THREE.Scene();scene.background=new THREE.Color(0x171a1d);scene.fog=new THREE.Fog(0x171a1d,28,75);const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,120);renderer.setSize(innerWidth,innerHeight);scene.add(new THREE.HemisphereLight(0xb7c6d4,0x30251e,1.5));const sun=new THREE.DirectionalLight(0xffe1bc,2.3);sun.position.set(8,18,7);sun.castShadow=true;scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(90,90),new THREE.MeshStandardMaterial({color:0x303234,roughness:.95}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);for(let i=0;i<42;i++){const h=.4+Math.random()*3,g=new THREE.Mesh(new THREE.BoxGeometry(.3+Math.random()*2,h,.3+Math.random()*2),new THREE.MeshStandardMaterial({color:[0x493f37,0x4b5051,0x352e2a][i%3]}));g.position.set((Math.random()-.5)*65,h/2,(Math.random()-.5)*65);g.rotation.y=Math.random()*6.28;g.castShadow=true;scene.add(g)}
const player={x:0,z:9,yaw:Math.PI,hp:100,kills:0,scrap:0,weapon:'FISTS',damage:24,range:2.4,inventory:[]};const enemies=[],drops=[],keys={};let locked=false,bench=false,last=performance.now(),cool=0;
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.75});function limb(w,h,d,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.castShadow=true;return m}function fighter(name,x,z){const root=new THREE.Group();root.position.set(x,0,z);const torso=limb(.72,1.05,.42,0x8d493f);torso.position.y=1.42;root.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.34,8,6),mat(0xd49a72));head.position.y=2.23;head.castShadow=true;root.add(head);for(const [sx,n] of [[-.52,'armL'],[.52,'armR']]){const q=limb(.22,.92,.22,0xd49a72);q.position.set(sx,1.42,0);root.add(q);root[n]=q}for(const [sx,n] of [[-.22,'legL'],[.22,'legR']]){const q=limb(.27,1,.29,0x3e4851);q.position.set(sx,.52,0);root.add(q);root[n]=q}root.parts=[head,root.armL,root.armR,root.legL,root.legR];root.userData={name,hp:75+Math.random()*45,alive:true,stun:0};scene.add(root);return root}function spawn(){let a=Math.random()*Math.PI*2,r=13+Math.random()*18;enemies.push(fighter(['Mutt','Rat King','Bolts','Meatbag','Wrench','Crank'][Math.floor(Math.random()*6)],Math.cos(a)*r,Math.sin(a)*r))}for(let i=0;i<9;i++)spawn();
function dropPart(pos){const types=['BONE','ARM','LEG','SKULL'];const type=types[Math.floor(Math.random()*types.length)],g=new THREE.Group();const m=type==='SKULL'?new THREE.Mesh(new THREE.SphereGeometry(.25,7,5),mat(0xd9c7a4)):limb(.16,type==='BONE'?.65:.8,.16,type==='BONE'?0xe4d6b8:0xc57f65);m.rotation.z=1.1;g.add(m);g.position.copy(pos);g.position.y=.25;g.userData.type=type;scene.add(g);drops.push(g)}function feed(t){const d=document.createElement('div');d.textContent=t;document.querySelector('#feed').prepend(d);setTimeout(()=>d.remove(),3500)}function flash(t){const m=document.querySelector('#msg');m.textContent=t;setTimeout(()=>{if(m.textContent===t)m.textContent=''},900)}
function kill(e){e.userData.alive=false;player.kills++;player.scrap+=35;feed('YOU dismantled '+e.userData.name+'  +35⚙');for(let i=0;i<2+Math.random()*3;i++)dropPart(e.position.clone().add(new THREE.Vector3((Math.random()-.5)*1.5,0,(Math.random()-.5)*1.5)));e.rotation.z=1.5;e.position.y=.25;setTimeout(()=>{scene.remove(e);enemies.splice(enemies.indexOf(e),1);spawn()},2600);hud()}
function attack(){if(bench||cool>0)return;cool=player.weapon==='RATTLE RIFLE'?.18:.38;let best=null,bd=999;const fwd=new THREE.Vector3(-Math.sin(player.yaw),0,-Math.cos(player.yaw));for(const e of enemies){if(!e.userData.alive)continue;const v=e.position.clone().sub(new THREE.Vector3(player.x,0,player.z)),d=v.length();if(d<player.range&&v.normalize().dot(fwd)>.45&&d<bd){best=e;bd=d}}if(best){best.userData.hp-=player.damage;best.userData.stun=.22;best.rotation.z+=(Math.random()-.5)*.55;flash(player.weapon==='FISTS'?'THUD':'CRUNCH');if(best.userData.hp<=0)kill(best)}else flash('WHIFF')}
function scavenge(){let best=null,d=2.2;for(const q of drops){const x=q.position.distanceTo(new THREE.Vector3(player.x,0,player.z));if(x<d){d=x;best=q}}if(!best)return flash('NOTHING TO GRAB');player.inventory.push(best.userData.type);drops.splice(drops.indexOf(best),1);scene.remove(best);flash('+ '+best.userData.type);hud()}
const recipes=[['BONE CLUB',20,35,2.8],['SCRAP AXE',55,48,2.7],['CHAINSAW',110,16,2.4],['RATTLE RIFLE',175,32,18]];const crafts=document.querySelector('#crafts');for(const r of recipes){const b=document.createElement('button');b.className='craft';b.innerHTML='<b>'+r[0]+'</b><br><span class="muted">'+r[1]+'⚙ · damage '+r[2]+'</span>';b.onclick=()=>{const discount=Math.min(player.inventory.length*8,r[1]-1),cost=r[1]-discount;if(player.scrap<cost)return flash('NEED '+(cost-player.scrap)+'⚙');player.scrap-=cost;player.inventory.splice(0,Math.ceil(discount/8));player.weapon=r[0];player.damage=r[2];player.range=r[3];flash('BUILT '+r[0]);hud()};crafts.appendChild(b)}function toggleBench(){bench=!bench;document.querySelector('#bench').style.display=bench?'block':'none';if(bench&&locked)document.exitPointerLock?.()}
function hud(){document.querySelector('#hp').style.width=player.hp+'%';document.querySelector('#kills').textContent=player.kills;document.querySelector('#scrap').textContent=player.scrap;document.querySelector('#gear').textContent=player.weapon+' · '+(player.inventory.length?player.inventory.join(' / '):'inventory empty')}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')scavenge();if(e.key.toLowerCase()==='b')toggleBench()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);canvas.addEventListener('click',()=>{if(!locked&&!bench)canvas.requestPointerLock?.();else attack()});document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement===canvas);document.addEventListener('mousemove',e=>{if(locked)player.yaw-=e.movementX*.0025});document.querySelector('#ma').onclick=attack;document.querySelector('#ml').ontouchstart=()=>keys.a=true;document.querySelector('#ml').ontouchend=()=>keys.a=false;document.querySelector('#mr').ontouchstart=()=>keys.d=true;document.querySelector('#mr').ontouchend=()=>keys.d=false;
function update(dt){cool=Math.max(0,cool-dt);const speed=(keys.shift?7.2:4.5)*dt,fwd=new THREE.Vector3(-Math.sin(player.yaw),0,-Math.cos(player.yaw)),side=new THREE.Vector3(Math.cos(player.yaw),0,-Math.sin(player.yaw));if(keys.w) {player.x+=fwd.x*speed;player.z+=fwd.z*speed}if(keys.s){player.x-=fwd.x*speed;player.z-=fwd.z*speed}if(keys.a){player.x-=side.x*speed;player.z-=side.z*speed}if(keys.d){player.x+=side.x*speed;player.z+=side.z*speed}player.x=Math.max(-38,Math.min(38,player.x));player.z=Math.max(-38,Math.min(38,player.z));for(const e of enemies){if(!e.userData.alive)continue;if(e.userData.stun>0){e.userData.stun-=dt;continue}const v=new THREE.Vector3(player.x-e.position.x,0,player.z-e.position.z),d=v.length();e.rotation.y=Math.atan2(v.x,v.z);if(d>1.4){v.normalize();e.position.addScaledVector(v,dt*(1.45+Math.min(player.kills*.04,.8)))}else if(Math.random()<dt*.7){player.hp=Math.max(0,player.hp-7);e.rotation.z=(Math.random()-.5)*.25;if(player.hp<=0){player.hp=100;player.scrap=Math.max(0,player.scrap-25);player.x=0;player.z=9;flash('YOU GOT SCRAPPED · -25⚙')}hud()}}camera.position.set(player.x+Math.sin(player.yaw)*5.5,3.4,player.z+Math.cos(player.yaw)*5.5);camera.lookAt(player.x,1.25,player.z)}function loop(t){const dt=Math.min(.04,(t-last)/1000);last=t;update(dt);renderer.render(scene,camera);requestAnimationFrame(loop)}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});hud();
</script></body></html>
