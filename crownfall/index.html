<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Crownfall</title><style>
:root{--bg:#15150f;--panel:#211f18;--ink:#e9dec3;--muted:#9d927b;--gold:#c9a55b;--line:#4a4434;--sea:#182b31;--bad:#b8665d;--good:#83a36d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Georgia,serif;overflow:hidden}button{background:#332e22;color:var(--ink);border:1px solid #65583b;padding:7px 10px;border-radius:3px;font:inherit;cursor:pointer}button:hover,.active{border-color:var(--gold);color:#fff}#top{height:50px;display:flex;align-items:center;gap:14px;padding:0 12px;background:#10100c;border-bottom:1px solid var(--line)}#brand{font-size:19px;color:var(--gold);letter-spacing:2px;font-weight:bold}.res{display:flex;gap:12px;margin-left:auto}.res b{color:#fff}#game{height:calc(100vh - 50px);display:grid;grid-template-columns:255px 1fr 310px}.side{background:var(--panel);padding:11px;overflow:auto}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}h2,h3{margin:6px 0 9px;color:var(--gold)}.card{border:1px solid var(--line);background:#191812;padding:9px;margin-bottom:8px}.small{color:var(--muted);font-size:12px;line-height:1.45}.stat{display:flex;justify-content:space-between;padding:3px 0}.bar{height:5px;background:#3b372d;margin:4px 0 8px}.bar i{display:block;height:100%;background:var(--gold)}#mapwrap{position:relative;background:var(--sea);overflow:hidden}svg{width:100%;height:100%;touch-action:none}.county{stroke:#19170f;stroke-width:2;cursor:pointer;transition:.15s}.county:hover,.county.sel{filter:brightness(1.35);stroke:#e8cf92;stroke-width:4}.label{pointer-events:none;fill:#efe5c9;font:700 14px Georgia;text-anchor:middle;text-shadow:0 1px 3px #000}.army circle{fill:#201d15;stroke:#ead18f;stroke-width:2}.army text{fill:#fff;text-anchor:middle;font:bold 10px sans-serif}.enemy circle{stroke:#d87668}.controls{position:absolute;display:flex;gap:4px;flex-wrap:wrap}.bottom{left:10px;bottom:10px}.modes{right:10px;top:10px}.log{font-size:11px;border-top:1px solid var(--line);padding:5px 0;color:#bdb196}.trait{display:inline-block;border:1px solid #5d5136;padding:2px 5px;margin:2px;font-size:11px;color:#d8c48e}.action{width:100%;margin:3px 0;text-align:left}.char{padding:6px;border-bottom:1px solid #393428;cursor:pointer}.char:hover{background:#29261d}.dead{opacity:.5}.war{border-left:3px solid var(--bad);padding-left:7px}.good{color:var(--good)}.bad{color:var(--bad)}@media(max-width:800px){#game{grid-template-columns:1fr}.side{position:absolute;z-index:5;top:50px;bottom:0;width:275px;transition:.2s}.left{left:0;transform:translateX(-100%)}.right{right:0;transform:translateX(100%)}.side.open{transform:none}#top{gap:6px}.res{font-size:10px;gap:6px}#brand{font-size:14px}#date{font-size:11px}.modes{top:7px}.modes button{font-size:10px;padding:5px}}
</style></head><body><div id="top"><div id="brand">CROWNFALL</div><span id="date"></span><div class="res"><span>🪙 <b id="gold"></b></span><span>🌾 <b id="food"></b></span><span>👥 <b>24.8k</b></span><span>⚔ <b id="levy"></b></span></div></div><div id="game"><aside class="side left" id="left"><div id="realmPanel"></div><h3>Dynasty</h3><div id="dynasty" class="card"></div><h3>Wars</h3><div id="wars"></div><h3>Chronicle</h3><div id="chronicle"></div></aside><main id="mapwrap"><svg id="map" viewBox="0 0 900 650"></svg><div class="controls modes"><button data-mode="realm" class="active">Realms</button><button data-mode="dev">Development</button><button data-mode="control">Control</button></div><div class="controls bottom"><button id="pause">⏸</button><button data-speed="1" class="active">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button><button id="leftBtn">Realm</button><button id="rightBtn">Inspect</button></div></main><aside class="side right" id="right"><div id="detail"></div></aside></div><script>
const NS='http://www.w3.org/2000/svg', realmColors={Veyra:'#7b3f3f',Ordel:'#3f617b',Kharad:'#756637',Elaris:'#496c4a',Mourn:'#654a70'};
const C=[
['c1','Veyrhold','Crownlands','Veyra','aldren',38,12.4,820,92,'70,150 190,90 270,155 230,260 105,275 45,220'],['c2','Greenmere','Crownlands','Veyra','ellyn',29,7.2,510,84,'230,260 270,155 390,135 430,235 350,315'],['c3','Ashenford','Dawnmarch','Veyra','torvan',24,6.3,690,78,'105,275 230,260 350,315 310,405 155,420 75,355'],['c4','Dawnwatch','Dawnmarch','Veyra','roderic',21,5.1,610,81,'155,420 310,405 365,500 260,570 115,520'],['c5','Silverbay','Crownlands','Veyra','mirelle',34,9.8,610,89,'45,220 105,275 75,355 22,330 15,250'],['c6','Ordelheim','High Ordel','Ordel','maeric',35,10.2,900,90,'390,135 515,85 590,160 545,260 430,235'],['c7','Frostfen','High Ordel','Ordel','soren',18,4.1,760,73,'515,85 650,55 720,125 590,160'],['c8','Red Vale','Kharad Reach','Kharad','azram',27,8.8,780,86,'430,235 545,260 575,370 465,410 350,315'],['c9','Sunscar','Kharad Reach','Kharad','rashad',20,6.7,720,77,'545,260 690,225 735,335 575,370'],['c10','Elarwood','Verdant Throne','Elaris','aelwyn',32,9.4,580,94,'310,405 350,315 465,410 455,535 365,500'],['c11','Thornweald','Verdant Throne','Elaris','caelan',26,7.6,490,88,'455,535 465,410 575,370 630,485 560,580'],['c12','Mournspire','Black Coast','Mourn','velka',23,7.1,850,69,'575,370 735,335 825,410 790,535 630,485'],['c13','Blacktide','Black Coast','Mourn','varos',17,4.8,670,65,'630,485 790,535 735,620 560,580']].map(x=>({id:x[0],name:x[1],duchy:x[2],realm:x[3],holder:x[4],dev:x[5],tax:x[6],levy:x[7],control:x[8],p:x[9],fort:1}));
const chars={aldren:{name:'King Aldren II Veyr',born:800,house:'Veyr',traits:['Ambitious','Just','Scholar'],dip:13,mart:11,stew:16,health:1,spouse:'mara',children:['edric','lyra'],alive:true},mara:{name:'Queen Mara Veyr',born:804,house:'Arden',traits:['Patient','Diplomat'],dip:17,mart:5,stew:12,health:1,spouse:'aldren',children:['edric','lyra'],alive:true},edric:{name:'Prince Edric Veyr',born:825,house:'Veyr',traits:['Brave','Impatient'],dip:9,mart:16,stew:8,health:1,alive:true},lyra:{name:'Princess Lyra Veyr',born:828,house:'Veyr',traits:['Clever','Calm'],dip:15,mart:7,stew:15,health:1,alive:true},ellyn:{name:'Countess Ellyn Green',born:813,house:'Green',traits:['Content'],alive:true},torvan:{name:'Duke Torvan Ash',born:791,house:'Ash',traits:['Brave','Wrathful'],alive:true},roderic:{name:'Baron Roderic Dawn',born:809,house:'Dawn',traits:['Loyal'],alive:true},mirelle:{name:'Lady Mirelle Vale',born:818,house:'Vale',traits:['Diplomat'],alive:true},maeric:{name:'King Maeric Ordel',born:796,house:'Ordel',traits:['Proud','Warlike'],alive:true},soren:{name:'Jarl Soren Iceborn',born:811,house:'Iceborn',traits:['Bold'],alive:true},azram:{name:'Sultan Azram Khar',born:802,house:'Khar',traits:['Patient','Greedy'],alive:true},rashad:{name:'Emir Rashad',born:816,house:'Rashad',traits:['Zealous'],alive:true},aelwyn:{name:'Queen Aelwyn',born:807,house:'Elar',traits:['Calm','Builder'],alive:true},caelan:{name:'Prince Caelan',born:827,house:'Elar',traits:['Clever'],alive:true},velka:{name:'Archon Velka',born:799,house:'Velka',traits:['Schemer','Ambitious'],alive:true},varos:{name:'Count Varos',born:815,house:'Varos',traits:['Cruel'],alive:true}};
const realmRulers={Veyra:'aldren',Ordel:'maeric',Kharad:'azram',Elaris:'aelwyn',Mourn:'velka'},adj={c1:['c2','c3','c5'],c2:['c1','c3','c6','c8'],c3:['c1','c2','c4','c8','c10'],c4:['c3','c10'],c5:['c1','c3'],c6:['c2','c7','c8'],c7:['c6'],c8:['c2','c3','c6','c9','c10','c11'],c9:['c8','c12'],c10:['c3','c8','c11'],c11:['c8','c10','c12','c13'],c12:['c9','c11','c13'],c13:['c11','c12']};
let S={year:842,month:3,day:17,gold:418,food:732,speed:1,paused:false,selected:'c1',mode:'realm',wars:[],history:[],playerRealm:'Veyra'};
const map=document.querySelector('#map');function centroid(p){let a=p.split(' ').map(q=>q.split(',').map(Number));return[a.reduce((s,v)=>s+v[0],0)/a.length,a.reduce((s,v)=>s+v[1],0)/a.length]}function age(ch){return S.year-ch.born}function holder(c){return chars[c.holder]||{name:'Vacant',traits:[]}}
function draw(){map.innerHTML='';C.forEach(c=>{let g=document.createElementNS(NS,'g'),p=document.createElementNS(NS,'polygon');p.setAttribute('points',c.p);let fill=realmColors[c.realm];if(S.mode==='dev'){let v=Math.max(35,Math.min(80,c.dev*2));fill=`hsl(43 45% ${v}%)`}if(S.mode==='control'){let v=Math.max(25,c.control*.55);fill=`hsl(105 30% ${v}%)`}p.setAttribute('fill',fill);p.setAttribute('class','county'+(S.selected===c.id?' sel':''));p.onclick=()=>{S.selected=c.id;render();if(innerWidth<800)right.classList.add('open')};g.append(p);let [x,y]=centroid(c.p),t=document.createElementNS(NS,'text');t.setAttribute('x',x);t.setAttribute('y',y);t.setAttribute('class','label');t.textContent=c.name;g.append(t);map.append(g)});S.wars.filter(w=>w.active).forEach((w,i)=>{let c=C.find(x=>x.id===w.front),[x,y]=centroid(c.p),g=document.createElementNS(NS,'g');g.setAttribute('class','army enemy');g.innerHTML=`<circle cx="${x}" cy="${y+22}" r="18"/><text x="${x}" y="${y+26}">${Math.round(w.attack)}</text>`;map.append(g)})}
function log(s){S.history.unshift(`${S.year}.${String(S.month).padStart(2,'0')}: ${s}`);S.history=S.history.slice(0,30)}
function renderRealm(){let r=realmRulers.Veyra,ch=chars[r],owned=C.filter(c=>c.realm==='Veyra');realmPanel.innerHTML=`<h2>Kingdom of Veyra</h2><div class="card"><b>${ch.name}</b><div class="small">Age ${age(ch)} · House ${ch.house}</div><div>${ch.traits.map(t=>`<span class="trait">${t}</span>`).join('')}</div><div class="stat"><span>Succession</span><b>${chars.edric.alive?'Edric':'Lyra'}</b></div><div class="stat"><span>Counties</span><b>${owned.length}</b></div><div class="stat"><span>Development</span><b>${Math.round(owned.reduce((s,c)=>s+c.dev,0)/owned.length)}</b></div></div>`;dynasty.innerHTML=['aldren','mara','edric','lyra'].map(id=>{let x=chars[id];return `<div class="char ${x.alive?'':'dead'}" data-char="${id}"><b>${x.name}</b><div class="small">${x.alive?'Age '+age(x):'Died'} · ${x.traits.join(', ')}</div></div>`}).join('');document.querySelectorAll('[data-char]').forEach(e=>e.onclick=()=>renderChar(e.dataset.char));wars.innerHTML=S.wars.filter(w=>w.active).map(w=>`<div class="card war"><b>${w.attacker}–${w.defender} War</b><div class="small">War score ${w.score>0?'+':''}${w.score} · ${C.find(c=>c.id===w.front).name}</div></div>`).join('')||'<div class="small">The realm is at peace.</div>';chronicle.innerHTML=S.history.map(x=>`<div class="log">${x}</div>`).join('')}
function renderChar(id){let x=chars[id];detail.innerHTML=`<h2>${x.name}</h2><div class="small">House ${x.house} · ${x.alive?'Age '+age(x):'Deceased'}</div><div class="card">${x.traits.map(t=>`<span class="trait">${t}</span>`).join('')}<div class="stat"><span>Diplomacy</span><b>${x.dip||8}</b></div><div class="stat"><span>Martial</span><b>${x.mart||8}</b></div><div class="stat"><span>Stewardship</span><b>${x.stew||8}</b></div></div>${x.children?`<h3>Children</h3>${x.children.map(c=>`<div class="char" onclick="renderChar('${c}')">${chars[c].name} · ${age(chars[c])}</div>`).join('')}:''}`}
function renderDetail(){let c=C.find(x=>x.id===S.selected),h=holder(c);detail.innerHTML=`<h2>${c.name}</h2><div class="small">County · Duchy of ${c.duchy}<br>Kingdom of ${c.realm}</div><div class="card"><b class="char" onclick="renderChar('${c.holder}')">${h.name}</b><div class="stat"><span>Development</span><b>${c.dev}</b></div><div class="stat"><span>Tax</span><b>${c.tax.toFixed(1)}</b></div><div class="stat"><span>Levies</span><b>${c.levy}</b></div><div class="stat"><span>Control</span><b>${c.control}%</b></div><div class="stat"><span>Fort</span><b>${c.fort}</b></div></div>${c.realm==='Veyra'?`<h3>Build</h3><button class="action" onclick="act('farm')">🌾 Farms · 80g</button><button class="action" onclick="act('fort')">🏰 Fortifications · 140g</button><button class="action" onclick="act('muster')">⚔ Muster +120</button>`:`<h3>Diplomacy</h3><button class="action" onclick="act('claim')">📜 Fabricate Claim</button><button class="action" onclick="act('war')">⚔ Declare Border War</button>`}<div id="msg" class="small"></div>`}
function act(a){let c=C.find(x=>x.id===S.selected),m='';if(a==='farm'&&S.gold>=80){S.gold-=80;c.dev++;c.tax+=1.2;m='Farms expanded.'}else if(a==='fort'&&S.gold>=140){S.gold-=140;c.fort++;m='Fortifications improved.'}else if(a==='muster'&&S.food>=40){S.food-=40;c.levy+=120;m='Local levy reinforced.'}else if(a==='claim')m=`A claim on ${c.name} is being prepared.`;else if(a==='war'){startWar('Veyra',c.realm,c.id);m='War declared.'}else m='Insufficient resources.';render();let el=document.querySelector('#msg');if(el)el.textContent=m}
function startWar(a,d,front){if(a===d||S.wars.some(w=>w.active&&((w.attacker===a&&w.defender===d)||(w.attacker===d&&w.defender===a))))return;let attack=C.filter(c=>c.realm===a).reduce((s,c)=>s+c.levy,0),def=C.filter(c=>c.realm===d).reduce((s,c)=>s+c.levy,0);S.wars.push({attacker:a,defender:d,front,attack,def,score:0,months:0,active:true});log(`${a} declared war on ${d}.`)}
function warTick(w){w.months++;let ar=.7+Math.random()*.6,dr=.7+Math.random()*.6,battle=w.attack*ar-w.def*dr;w.score=Math.max(-100,Math.min(100,w.score+(battle>0?8:-8)));w.attack=Math.max(100,w.attack-Math.random()*w.def*.08);w.def=Math.max(100,w.def-Math.random()*w.attack*.08);if(Math.abs(w.score)>=80||w.months>24){w.active=false;if(w.score>0){let c=C.find(x=>x.id===w.front);let old=c.realm;c.realm=w.attacker;c.control=45;log(`${w.attacker} won the war and seized ${c.name} from ${old}.`)}else log(`${w.defender} defeated ${w.attacker}'s invasion.`)}}
function aiMonth(){Object.keys(realmRulers).filter(r=>r!=='Veyra').forEach(r=>{let own=C.filter(c=>c.realm===r);if(Math.random()<.22){let c=own[Math.floor(Math.random()*own.length)];c.dev++;c.tax+=.2}if(Math.random()<.045&&!S.wars.some(w=>w.active&&(w.attacker===r||w.defender===r))){let borders=own.flatMap(c=>(adj[c.id]||[]).map(id=>C.find(x=>x.id===id))).filter(c=>c&&c.realm!==r);if(borders.length){let target=borders[Math.floor(Math.random()*borders.length)];startWar(r,target.realm,target.id)}}});S.wars.filter(w=>w.active).forEach(warTick)}
function yearly(){Object.entries(chars).forEach(([id,ch])=>{if(!ch.alive)return;let a=age(ch),risk=a<50?.002:a<65?.015:a<75?.05:.14;if(Math.random()<risk){ch.alive=false;log(`${ch.name} died at age ${a}.`);for(let c of C.filter(c=>c.holder===id)){let heir=(ch.children||[]).find(k=>chars[k]?.alive);if(heir){c.holder=heir;log(`${chars[heir].name} inherited ${c.name}.`)}}for(let [r,rid] of Object.entries(realmRulers))if(rid===id){let heir=(ch.children||[]).find(k=>chars[k]?.alive);if(heir){realmRulers[r]=heir;log(`${chars[heir].name} succeeded to the throne of ${r}.`)}}}})}
function advance(){if(S.paused)return;for(let z=0;z<S.speed;z++){S.day+=4;if(S.day>28){S.day-=28;S.month++;S.gold+=Math.round(C.filter(c=>c.realm==='Veyra').reduce((s,c)=>s+c.tax,0));S.food+=18;aiMonth();if(S.month>12){S.month=1;S.year++;yearly()}}}render()}
function render(){date.textContent=`${S.day} · ${S.month}/${S.year}`;gold.textContent=Math.round(S.gold);food.textContent=Math.round(S.food);levy.textContent=C.filter(c=>c.realm==='Veyra').reduce((s,c)=>s+c.levy,0).toLocaleString();draw();renderRealm();renderDetail()}
pause.onclick=()=>{S.paused=!S.paused;pause.textContent=S.paused?'▶':'⏸'};document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{S.speed=+b.dataset.speed;document.querySelectorAll('[data-speed]').forEach(x=>x.classList.toggle('active',x===b))});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));draw()});leftBtn.onclick=()=>left.classList.toggle('open');rightBtn.onclick=()=>right.classList.toggle('open');log('King Aldren II opens the spring court at Veyrhold.');render();setInterval(advance,900);
</script></body></html>
