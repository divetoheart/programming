<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Crownfall</title><style>:root{--b:#12130f;--p:#201f19;--i:#e7ddc6;--m:#9d947f;--g:#c7a55c;--l:#494334;--sea:#14282f}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--i);font:13px Georgia,serif;overflow:hidden}button{background:#302c22;color:var(--i);border:1px solid #62563c;padding:7px;border-radius:3px}button.active,button:hover{border-color:var(--g)}#top{height:48px;background:#0d0e0b;display:flex;align-items:center;padding:0 12px;gap:12px;border-bottom:1px solid var(--l)}#brand{color:var(--g);font-weight:bold;letter-spacing:2px;font-size:18px}.resources{margin-left:auto;display:flex;gap:12px}#layout{height:calc(100vh - 48px);display:grid;grid-template-columns:255px 1fr 310px}.side{background:var(--p);overflow:auto;padding:10px}.left{border-right:1px solid var(--l)}.right{border-left:1px solid var(--l)}#world{position:relative;background:var(--sea);overflow:hidden}svg{width:100%;height:100%}.county{stroke:#15150f;stroke-width:2;cursor:pointer}.county:hover,.sel{stroke:#f0d999;stroke-width:4;filter:brightness(1.25)}.lbl{fill:#eee2c8;text-anchor:middle;font:bold 11px Georgia;pointer-events:none;text-shadow:0 1px 3px #000}.realmLbl{fill:#f2dfaa;text-anchor:middle;font:bold 22px Georgia;opacity:.5;pointer-events:none}.card{background:#181812;border:1px solid var(--l);padding:8px;margin:6px 0}.stat{display:flex;justify-content:space-between;padding:2px}.small{font-size:11px;color:var(--m);line-height:1.4}h2,h3{color:var(--g);margin:7px 0}.trait{display:inline-block;border:1px solid #5b5039;padding:2px 4px;margin:2px;font-size:10px}.row{padding:6px;border-bottom:1px solid #39352b;cursor:pointer}.row:hover{background:#29271f}.action{width:100%;text-align:left;margin:3px 0}.log{border-top:1px solid #373329;padding:5px 0;font-size:11px;color:#bbb09a}.army circle{fill:#161610;stroke:#ead18e;stroke-width:2}.army text{fill:#fff;text-anchor:middle;font:bold 9px sans-serif}.controls{position:absolute;display:flex;gap:4px;z-index:3}.speed{bottom:10px;left:10px}.modes{top:10px;right:10px}.badge{font-size:10px;padding:2px 4px;border:1px solid var(--l)}@media(max-width:800px){#layout{grid-template-columns:1fr}.side{position:absolute;top:48px;bottom:0;width:280px;z-index:8;transition:.2s}.left{left:0;transform:translateX(-100%)}.right{right:0;transform:translateX(100%)}.side.open{transform:none}.resources{font-size:10px;gap:6px}#brand{font-size:13px}.modes button{font-size:9px;padding:5px}}</style></head><body><div id="top"><div id="brand">CROWNFALL</div><span id="date"></span><div class="resources"><span>🪙 <b id="gold"></b></span><span>🌾 <b id="food"></b></span><span>👥 <b id="population"></b></span><span>⚔ <b id="troops"></b></span></div></div><div id="layout"><aside id="left" class="side left"><div id="realm"></div><h3>House Veyr</h3><div id="family"></div><h3>Chronicle</h3><div id="history"></div></aside><main id="world"><svg id="map" viewBox="0 0 1000 700"></svg><div class="controls modes"><button data-mode="political" class="active">Political</button><button data-mode="duchy">Duchies</button><button data-mode="development">Development</button></div><div class="controls speed"><button id="pause">⏸</button><button data-speed="1" class="active">1×</button><button data-speed="2">2×</button><button data-speed="5">5×</button><button id="realmBtn">Realm</button><button id="inspectBtn">Inspect</button></div></main><aside id="right" class="side right"><div id="detail"></div></aside></div><script>
const NS='http://www.w3.org/2000/svg',R={Veyra:'#793f42',Ordel:'#3e6078',Kharad:'#756338',Elaris:'#496b4c',Mourn:'#664b70',Caerwyn:'#7a5940',Ilyrion:'#526b76',Sablemarch:'#69414e'};let rng=()=>Math.random();const realmNames=Object.keys(R),duchies={Veyra:['Crownlands','Dawnmarch'],Ordel:['High Ordel','Frostmark'],Kharad:['Red Reach','Sun Coast'],Elaris:['Greenheart','Thornwood'],Mourn:['Black Coast','Gloam'],Caerwyn:['Westvale','Stonefield'],Ilyrion:['Lake Crown','Silverwood'],Sablemarch:['Sable Vale','Nightfen']};const first=['Aldren','Mara','Edric','Lyra','Torvan','Ellyn','Maeric','Soren','Azram','Rashad','Aelwyn','Caelan','Velka','Varos','Roderic','Mirelle','Cassian','Elara','Orren','Talia','Beren','Seris','Lucan','Nerys','Hadric','Vela'];const houses=['Veyr','Ash','Green','Ordel','Iceborn','Khar','Elar','Velka','Varos','Caer','Ilyr','Sable','Dawn','Vale'];const traits=['Ambitious','Just','Brave','Patient','Greedy','Clever','Calm','Warlike','Builder','Schemer','Loyal','Proud'];let chars={},cid=0;function mkChar(name,house,born,sex){let id='p'+(++cid);chars[id]={id,name:name+' '+house,house,born,sex,alive:true,traits:[traits[Math.floor(rng()*traits.length)],traits[Math.floor(rng()*traits.length)]],dip:5+Math.floor(rng()*15),mart:5+Math.floor(rng()*15),stew:5+Math.floor(rng()*15),spouse:null,children:[],memories:[]};return id}let rulers={};realmNames.forEach((r,i)=>rulers[r]=mkChar(first[i*2]||first[i],r==='Veyra'?'Veyr':houses[(i+3)%houses.length],798+i*2,i%2?'F':'M'));let aldren=rulers.Veyra;chars[aldren].name='Aldren II Veyr';let mara=mkChar('Mara','Arden',804,'F'),edric=mkChar('Edric','Veyr',825,'M'),lyra=mkChar('Lyra','Veyr',828,'F');chars[aldren].spouse=mara;chars[mara].spouse=aldren;chars[aldren].children=[edric,lyra];chars[mara].children=[edric,lyra];
const cols=8,rows=5,names=['Veyrhold','Greenmere','Ashenford','Dawnwatch','Silverbay','Ordelheim','Frostfen','Red Vale','Sunscar','Elarwood','Thornweald','Mournspire','Blacktide','Caer Tor','Westmere','Stonecross','Ilyr','Silverlake','Brightwood','Sablekeep','Nightfen','Greywatch','Oakrest','Ravenna','Highmere','Ironwood','Starfall','Mistvale','Wolfden','Goldfield','Moonrest','Kingsfen','Rosewood','Emberfall','Northpass','Southbay','Eastwatch','Deepwood','Crowmere','Whitecliff'];let C=[],adj={};for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let i=y*cols+x,id='c'+i,xx=30+x*116+(y%2)*12,yy=45+y*125,realm=realmNames[Math.min(7,Math.floor(x/2)+Math.floor(y/3)*4)],du=duchies[realm][(x+y)%2],holder=i===0?aldren:mkChar(first[(i+9)%first.length],houses[(i+2)%houses.length],790+Math.floor(rng()*35),i%2?'F':'M');C.push({id,name:names[i],realm,duchy:du,holder,dev:12+Math.floor(rng()*30),control:65+Math.floor(rng()*31),tax:3+rng()*9,levy:300+Math.floor(rng()*700),pop:2500+Math.floor(rng()*8000),fort:1,farms:1,market:0,x:xx,y:yy,p:`${xx},${yy+18} ${xx+48},${yy} ${xx+102},${yy+22} ${xx+108},${yy+84} ${xx+58},${yy+112} ${xx+5},${yy+88}`});adj[id]=[]}
C.forEach((c,i)=>{let x=i%cols,y=Math.floor(i/cols);[[x-1,y],[x+1,y],[x,y-1],[x,y+1]].forEach(([a,b])=>{if(a>=0&&a<cols&&b>=0&&b<rows)adj[c.id].push('c'+(b*cols+a))})});const titleDefs=[];realmNames.forEach(r=>{titleDefs.push({tier:'kingdom',name:'Kingdom of '+r,holder:rulers[r]});duchies[r].forEach(d=>titleDefs.push({tier:'duchy',name:'Duchy of '+d,holder:C.find(c=>c.realm===r&&c.duchy===d)?.holder}))});
let S={year:842,month:3,day:17,gold:620,food:980,speed:1,paused:false,selected:'c0',mode:'political',history:[],wars:[],armies:[],builds:[],player:'Veyra'};function age(p){return S.year-p.born}function log(s){S.history.unshift(`${S.year}.${String(S.month).padStart(2,'0')} — ${s}`);S.history=S.history.slice(0,40)}function centroid(c){return[c.x+55,c.y+55]}function color(c){if(S.mode==='political')return R[c.realm];if(S.mode==='duchy'){let n=Object.values(duchies).flat().indexOf(c.duchy);return `hsl(${n*37%360} 35% 43%)`}return `hsl(43 55% ${25+c.dev}%)`}
function draw(){map.innerHTML='';C.forEach(c=>{let g=document.createElementNS(NS,'g'),p=document.createElementNS(NS,'polygon');p.setAttribute('points',c.p);p.setAttribute('fill',color(c));p.setAttribute('class','county '+(S.selected===c.id?'sel':''));p.onclick=()=>{S.selected=c.id;render();if(innerWidth<800)right.classList.add('open')};g.append(p);let [x,y]=centroid(c),t=document.createElementNS(NS,'text');t.setAttribute('x',x);t.setAttribute('y',y);t.setAttribute('class','lbl');t.textContent=c.name;g.append(t);map.append(g)});S.armies.forEach(a=>{let c=C.find(q=>q.id===a.at),[x,y]=centroid(c),g=document.createElementNS(NS,'g');g.setAttribute('class','army');g.innerHTML=`<circle cx="${x}" cy="${y+24}" r="16"/><text x="${x}" y="${y+27}">${Math.round(a.size/100)/10}k</text>`;map.append(g)})}
function realmPanel(){let own=C.filter(c=>c.realm===S.player),r=chars[rulers[S.player]],du=[...new Set(own.map(c=>c.duchy))];realm.innerHTML=`<h2>${S.player}</h2><div class="card"><b>${r.name}</b><div class="small">Age ${age(r)} · House ${r.house}</div>${r.traits.map(t=>`<span class="trait">${t}</span>`).join('')}<div class="stat"><span>Counties</span><b>${own.length}</b></div><div class="stat"><span>Duchies</span><b>${du.length}</b></div><div class="stat"><span>Realm population</span><b>${Math.round(own.reduce((s,c)=>s+c.pop,0)/1000)}k</b></div></div><h3>De Jure Titles</h3>${titleDefs.filter(t=>t.name.includes(S.player)||du.some(d=>t.name.includes(d))).map(t=>`<div class="small"><span class="badge">${t.tier}</span> ${t.name}</div>`).join('')}`;family.innerHTML=[aldren,mara,...chars[aldren].children].map(id=>{let p=chars[id];return `<div class="row" onclick="showChar('${id}')"><b>${p.name}</b><div class="small">${p.alive?'Age '+age(p):'Deceased'} · ${p.traits.join(', ')}</div></div>`}).join('');history.innerHTML=S.history.map(h=>`<div class="log">${h}</div>`).join('')}
function showChar(id){let p=chars[id];detail.innerHTML=`<h2>${p.name}</h2><div class="small">House ${p.house} · ${p.alive?'Age '+age(p):'Deceased'}</div><div class="card">${p.traits.map(t=>`<span class="trait">${t}</span>`).join('')}<div class="stat"><span>Diplomacy</span><b>${p.dip}</b></div><div class="stat"><span>Martial</span><b>${p.mart}</b></div><div class="stat"><span>Stewardship</span><b>${p.stew}</b></div></div>${p.spouse?`<h3>Spouse</h3><div class="row" onclick="showChar('${p.spouse}')">${chars[p.spouse].name}</div>`:''}<h3>Life</h3>${(p.memories.length?p.memories:['No major memories yet.']).map(m=>`<div class="log">${m}</div>`).join('')}`}
function countyPanel(){let c=C.find(q=>q.id===S.selected),p=chars[c.holder],mine=c.realm===S.player;detail.innerHTML=`<h2>${c.name}</h2><div class="small">County of ${c.name}<br>Duchy of ${c.duchy} · ${c.realm}</div><div class="row" onclick="showChar('${p.id}')"><b>${p.name}</b><div class="small">Age ${age(p)} · House ${p.house}</div></div><div class="card"><div class="stat"><span>Development</span><b>${c.dev}</b></div><div class="stat"><span>Control</span><b>${c.control}%</b></div><div class="stat"><span>Population</span><b>${c.pop.toLocaleString()}</b></div><div class="stat"><span>Tax</span><b>${c.tax.toFixed(1)}</b></div><div class="stat"><span>Levies</span><b>${c.levy}</b></div><div class="stat"><span>Fort</span><b>${c.fort}</b></div></div>${mine?`<h3>Holdings</h3><button class="action" onclick="build('farm')">🌾 Farm ${c.farms} → ${c.farms+1} · 90g</button><button class="action" onclick="build('market')">🏘 Market ${c.market} → ${c.market+1} · 120g</button><button class="action" onclick="build('fort')">🏰 Fort ${c.fort} → ${c.fort+1} · 160g</button><button class="action" onclick="raiseArmy()">⚔ Raise Army</button>`:`<h3>Foreign Realm</h3><button class="action" onclick="declareWar()">⚔ Press Border Claim</button>`}<h3>Construction</h3>${S.builds.filter(b=>b.county===c.id).map(b=>`<div class="small">${b.type} · ${b.months} months</div>`).join('')||'<div class="small">No active construction.</div>'}`}
function build(type){let cost={farm:90,market:120,fort:160}[type];if(S.gold<cost)return;S.gold-=cost;S.builds.push({county:S.selected,type,months:4});log(`Construction began in ${C.find(c=>c.id===S.selected).name}.`);render()}function raiseArmy(){let c=C.find(q=>q.id===S.selected);if(c.realm!==S.player||c.levy<100)return;let size=Math.floor(c.levy*.75);c.levy-=size;S.armies.push({id:'a'+Date.now(),realm:S.player,at:c.id,size,dest:null});log(`${size} troops raised at ${c.name}.`);render()}function declareWar(){let c=C.find(q=>q.id===S.selected);if(c.realm===S.player)return;let border=C.filter(x=>x.realm===S.player).some(x=>adj[x.id].includes(c.id));if(!border){log('A border claim requires an adjacent county.');return}S.wars.push({attacker:S.player,defender:c.realm,target:c.id,score:0,months:0});log(`${S.player} declared war on ${c.realm} for ${c.name}.`);let from=C.find(x=>x.realm===S.player&&adj[x.id].includes(c.id));S.armies.push({id:'war'+Date.now(),realm:S.player,at:from.id,size:C.filter(x=>x.realm===S.player).reduce((s,x)=>s+x.levy,0)*.45,dest:c.id});render()}
function month(){S.gold+=C.filter(c=>c.realm===S.player).reduce((s,c)=>s+c.tax,0);S.food+=C.filter(c=>c.realm===S.player).reduce((s,c)=>s+c.farms*3,0);S.builds.forEach(b=>b.months--);S.builds.filter(b=>b.months<=0).forEach(b=>{let c=C.find(x=>x.id===b.county);c[b.type]++;if(b.type==='farm'){c.tax+=.5;c.pop+=300}if(b.type==='market')c.tax+=1.4;log(`${b.type} completed in ${c.name}.`)});S.builds=S.builds.filter(b=>b.months>0);S.armies.forEach(a=>{if(a.dest&&adj[a.at].includes(a.dest)){a.at=a.dest;a.dest=null;let w=S.wars.find(w=>w.target===a.at&&w.attacker===a.realm);if(w){let c=C.find(x=>x.id===w.target),def=c.levy*(.8+c.fort*.25),roll=a.size*(.75+rng()*.5)-def*(.75+rng()*.5);w.score+=roll>0?25:-18;w.months++;a.size*=roll>0?.9:.72;c.levy=Math.max(80,c.levy*(roll>0?.55:.85));if(w.score>=75){let old=c.realm;c.realm=w.attacker;c.control=40;log(`${c.name} fell. ${w.attacker} takes it from ${old}.`);S.wars=S.wars.filter(x=>x!==w)}else if(w.score<=-60){log(`${w.defender} repelled the invasion of ${c.name}.`);S.wars=S.wars.filter(x=>x!==w)}}}});realmNames.filter(r=>r!==S.player).forEach(r=>{let own=C.filter(c=>c.realm===r);if(rng()<.18){let c=own[Math.floor(rng()*own.length)];c.dev++;c.tax+=.15}if(rng()<.03){let border=own.flatMap(c=>adj[c.id].map(id=>C.find(x=>x.id===id))).filter(c=>c&&c.realm!==r);if(border.length){let t=border[Math.floor(rng()*border.length)];if(rng()<.4){let old=t.realm;t.realm=r;t.control=35;log(`${r} seized ${t.name} from ${old} after a frontier war.`)}}}})}function yearly(){Object.values(chars).forEach(p=>{if(!p.alive)return;let a=age(p),risk=a<50?.002:a<65?.015:a<75?.05:.13;if(rng()<risk){p.alive=false;p.memories.push(`Died in ${S.year} at age ${a}.`);log(`${p.name} died at age ${a}.`);Object.entries(rulers).forEach(([r,id])=>{if(id===p.id){let heir=p.children.find(k=>chars[k]?.alive);if(!heir){heir=mkChar(first[Math.floor(rng()*first.length)],p.house,S.year-20,rng()<.5?'M':'F')}rulers[r]=heir;chars[heir].memories.push(`Inherited the crown of ${r} in ${S.year}.`);log(`${chars[heir].name} inherited the crown of ${r}.`)}})}});let couples=Object.values(chars).filter(p=>p.alive&&p.spouse&&p.sex==='F'&&age(p)>18&&age(p)<42);couples.forEach(m=>{if(rng()<.22){let dad=chars[m.spouse],id=mkChar(first[Math.floor(rng()*first.length)],dad.house,S.year,rng()<.5?'M':'F');m.children.push(id);dad.children.push(id);m.memories.push(`A child, ${chars[id].name}, was born in ${S.year}.`);dad.memories.push(`A child, ${chars[id].name}, was born in ${S.year}.`);log(`${chars[id].name} was born to House ${dad.house}.`)}})}function tick(){if(S.paused)return;for(let i=0;i<S.speed;i++){S.day+=5;if(S.day>30){S.day-=30;S.month++;month();if(S.month>12){S.month=1;S.year++;yearly()}}}render()}function render(){date.textContent=`${S.day}/${S.month}/${S.year}`;gold.textContent=Math.floor(S.gold);food.textContent=Math.floor(S.food);let own=C.filter(c=>c.realm===S.player);population.textContent=Math.round(own.reduce((s,c)=>s+c.pop,0)/1000)+'k';troops.textContent=Math.round(own.reduce((s,c)=>s+c.levy,0)).toLocaleString();draw();realmPanel();countyPanel()}pause.onclick=()=>{S.paused=!S.paused;pause.textContent=S.paused?'▶':'⏸'};document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{S.speed=+b.dataset.speed;document.querySelectorAll('[data-speed]').forEach(x=>x.classList.toggle('active',x===b))});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));draw()});realmBtn.onclick=()=>left.classList.toggle('open');inspectBtn.onclick=()=>right.classList.toggle('open');log('King Aldren II opens the spring court at Veyrhold.');render();setInterval(tick,900);</script></body></html>
