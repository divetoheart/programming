<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121618" />
    <meta name="description" content="A playable arrival at Solvyr, capital of Solvyn." />
    <title>Solvyn — Arrival at Solvyr</title>
  </head>
  <body>
    <div id="game"></div>

    <div id="hud" aria-hidden="true">
      <div class="quest">
        <span class="quest-kicker">AN AUDIENCE AT SOLVYR</span>
        <span id="objective"></span>
      </div>
      <div id="location" class="location"></div>
      <div id="crosshair"><i></i><i></i></div>
      <div id="prompt" class="prompt"></div>
      <div id="toast" class="toast"></div>
      <div id="chapter" class="chapter">
        <span id="chapter-kicker"></span>
        <strong id="chapter-title"></strong>
        <small id="chapter-subtitle"></small>
      </div>
      <div id="vignette"></div>
    </div>

    <button id="start" class="start" type="button">
      <span class="crest" aria-hidden="true"><b></b><b></b><b></b></span>
      <span class="eyebrow">SOLVYN</span>
      <strong>Arrival at Solvyr</strong>
      <span class="tagline">The Crown keeps its promises. The city keeps its secrets.</span>
      <span class="controls">Click to enter · WASD move · Mouse look · Shift sprint · Space jump · E interact</span>
    </button>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
