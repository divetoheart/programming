<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101417" />
    <title>Solvyn — Solvyr Castle</title>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud">
      <div id="location" class="location"></div>
      <div id="objective" class="objective"></div>
      <div id="crosshair">+</div>
      <div id="prompt" class="prompt"></div>
      <div id="toast" class="toast"></div>
    </div>
    <button id="start" class="start">
      <span class="eyebrow">SOLVYN</span>
      <strong>Enter the Capital</strong>
      <span>Click to begin · WASD move · Mouse look · Shift sprint · Space jump · E interact</span>
    </button>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
